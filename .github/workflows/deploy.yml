name: Deploy to GitHub Pages

# Publishes a landing page at the root plus every app at its own subpath:
#
#   landing/            -> https://topiu.github.io/
#   liikepaivakirja/    -> https://topiu.github.io/liikepaivakirja/
#   mokkipohja/         -> https://topiu.github.io/mokkipohja/
#   <any-folder>/       -> https://topiu.github.io/<any-folder>/
#
# Convention over configuration: adding an app means adding a folder — neither
# this file nor the landing page needs to change.
#
#   - A folder with a package.json is built with BASE_PATH=/<folder>/. It needs
#     a "build" script that honours BASE_PATH and writes to dist/, and a "test"
#     script (use "test": "true" if it has none).
#   - A folder without one is published as-is if it holds an .html page: its
#     index.html, or its only .html file when there is no index.html.
#
# The landing page lists every app with the name, description and icon taken
# from the app's own index.html, written into apps.json at deploy time along
# with the deployed commit.
#
# The steps live in .github/scripts/ so they run the same way locally, and so
# they can change without touching this file: GitHub refuses edits under
# .github/workflows/ from a token without the workflow scope, such as the one
# "Apply zip" commits with.

on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time, but an in-progress one is never cancelled.
# Cancelling a run that has already entered actions/deploy-pages can leave the
# Pages deployment unfinished, and a site with no completed deployment serves
# GitHub's default page. This is what the official Pages starter workflow means
# by "do NOT cancel in-progress runs"; `true` here was a real defect.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # Reads the Pages configuration; it does NOT switch the source. Settings →
      # Pages → Source must say "GitHub Actions". On "Deploy from a branch",
      # GitHub's own "pages build and deployment" races this workflow on every
      # push and can publish the raw branch — whose index.html points at
      # /src/main.tsx and 404s — over a green deploy (it did on 2026-10-06).
      - uses: actions/configure-pages@v6

      # Builds or copies every app into _site/ and writes apps.json.
      - name: Assemble site
        run: bash .github/scripts/assemble-site.sh

      # Fails if a published page references an asset missing from the
      # artifact, so a broken build never replaces the live site.
      - name: Verify the assembled site
        run: bash .github/scripts/verify-site.sh

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
