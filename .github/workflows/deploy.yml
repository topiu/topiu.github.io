name: Deploy to GitHub Pages

# Publishes a landing page at the root plus every app at its own subpath:
#
#   landing/            -> https://topiu.github.io/
#   liikepaivakirja/    -> https://topiu.github.io/liikepaivakirja/
#   <any-folder>/       -> https://topiu.github.io/<any-folder>/
#
# Convention over configuration: any immediate subfolder containing a
# package.json is treated as an app, built with BASE_PATH=/<folder>/ and copied
# to _site/<folder>/. Adding an app means adding a folder — this file does not
# need to change. Requirements on an app folder: a "build" script that honours
# BASE_PATH and writes to dist/, and a "test" script (use "test": "true" if it
# has none).

on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time, but an in-progress one is never cancelled.
# Cancelling a run that has already entered actions/deploy-pages can leave the
# Pages deployment unfinished, and a site with no completed deployment serves
# GitHub's default page. This is what the official Pages starter workflow means
# by "do NOT cancel in-progress runs"; `true` here was a real defect.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # Before the build on purpose. This is what tells Pages to serve the
      # Actions artifact rather than the repository branch. If it ran after the
      # build and the build failed, the source could stay on branch serving —
      # which publishes the *unbuilt* index.html, whose script tag points at
      # /src/main.tsx and 404s. Running it first means a failed build leaves the
      # previous good deployment in place instead.
      - uses: actions/configure-pages@v6

      - name: Assemble site
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p _site
          if [ -d landing ]; then cp -r landing/. _site/; fi

          apps=()
          for pkg in */package.json; do
            app="$(dirname "$pkg")"
            echo "::group::build $app"
            ( cd "$app" \
              && npm ci --no-audit --no-fund \
              && npm test \
              && BASE_PATH="/$app/" npm run build )
            mkdir -p "_site/$app"
            cp -r "$app/dist/." "_site/$app/"
            apps+=("$app")
            echo "::endgroup::"
          done

          if [ ${#apps[@]} -eq 0 ]; then
            list=""
          else
            list="$(printf '"%s",' "${apps[@]}" | sed 's/,$//')"
          fi
          printf '{"built":"%s","apps":[%s]}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$list" > _site/apps.json

          echo "publishing:"
          find _site -maxdepth 2 -mindepth 1 | sort

      # A broken publish used to be silent: the page loaded and simply did
      # nothing. Every local asset an app's index.html references must exist in
      # the artifact, and no page may still point at unbuilt sources. Failing
      # here keeps the last good deployment live instead of replacing it with
      # something that cannot start.
      - name: Verify the assembled site
        run: |
          set -euo pipefail
          fail=0
          for d in _site/*/; do
            app="$(basename "$d")"
            page="$d/index.html"
            [ -f "$page" ] || continue

            if grep -qE '(src|href)="[^"]*/src/' "$page"; then
              echo "::error::$app/index.html still points at unbuilt sources"
              fail=1
            fi

            while IFS= read -r ref; do
              case "$ref" in
                ""|http*|//*|data:*|\#*|mailto:*) continue ;;
                /*) target="_site${ref}" ;;
                *)  target="${d}${ref}" ;;
              esac
              target="${target%%\?*}"; target="${target%%\#*}"
              if [ ! -e "$target" ]; then
                echo "::error::$app references $ref but $target is not in the artifact"
                fail=1
              fi
            done < <(grep -oE '(src|href)="[^"]+"' "$page" | sed -E 's/^[^"]*"//; s/"$//')
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "verified: every referenced asset is present"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
