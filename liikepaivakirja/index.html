<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Liikepäiväkirja</title>
    <meta name="theme-color" content="#EDF1EF" />
    <meta name="description" content="Fysioterapiaharjoitusten ja oireiden päiväkirja." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Liikepäiväkirja" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html, body { margin: 0; padding: 0; background: #EDF1EF; }
    </style>
  </head>
  <body>
    <!-- Placeholder, replaced by React on mount. It exists so that a failure to
         load the bundle shows something diagnosable instead of a white screen —
         which is precisely what a raw-source deploy looks like, because the script
         below is a TypeScript entry point that only exists after a build. -->
    <div id="root">
      <div style="max-width: 26rem; margin: 15vh auto; padding: 0 1.5rem; font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #2C3A34;">
        <h1 style="font-size: 1.15rem; margin: 0 0 0.5rem;">Liikepäiväkirja ei latautunut</h1>
        <p style="margin: 0 0 0.75rem; color: #5A6B63;">
          Sovelluksen tiedostot eivät avautuneet. Merkinnät ovat tallessa laitteella — tämä ei poista niitä.
        </p>
        <ul style="margin: 0; padding-left: 1.2rem; color: #5A6B63;">
          <li>Tarkista verkkoyhteys ja lataa sivu uudelleen.</li>
          <li>Jos sivu on tyhjä toistuvasti, lisää osoitteen perään <b>?sw=off</b>.</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
