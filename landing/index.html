<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>topiu.github.io</title>
    <meta name="theme-color" content="#EDF1EF" />
    <style>
      :root {
        --bg: #edf1ef;
        --surface: #fff;
        --ink: #16241f;
        --ink-soft: #5c6b65;
        --ink-faint: #98a39d;
        --line: #e0e7e3;
        --pine: #1f7a5c;
        --pine-tint: #eaf3ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 48px 20px 64px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 560px; margin: 0 auto; }
      h1 {
        margin: 0 0 4px;
        font-size: 26px;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      .sub { margin: 0 0 32px; color: var(--ink-soft); font-size: 14px; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      a.card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      a.card:hover, a.card:focus-visible {
        border-color: var(--pine);
        transform: translateY(-1px);
      }
      .dot {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--pine-tint);
        color: var(--pine);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 15px;
      }
      .name { font-weight: 550; }
      .path { color: var(--ink-faint); font-size: 13px; font-variant-numeric: tabular-nums; }
      .arrow { margin-left: auto; color: var(--ink-faint); }
      .note { margin-top: 28px; font-size: 13px; color: var(--ink-faint); }
      .empty {
        padding: 20px 18px;
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--ink-faint);
        font-size: 14px;
        background: var(--surface);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>topiu.github.io</h1>
      <p class="sub">Sovellukset</p>
      <ul id="apps"><li class="empty">Ladataan…</li></ul>
      <p class="note" id="built"></p>
    </main>

    <script>
      /* apps.json is generated by the deploy workflow from the folders it built,
         so this list never goes stale when a new app is added. */
      const TITLES = { liikepaivakirja: "Liikepäiväkirja" };

      function initials(name) {
        return name.replace(/[^a-zA-ZäöåÄÖÅ]/g, "").slice(0, 2).toUpperCase();
      }

      (async () => {
        const ul = document.getElementById("apps");
        try {
          const res = await fetch("apps.json", { cache: "no-cache" });
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          const apps = data.apps || [];
          if (!apps.length) {
            ul.innerHTML = '<li class="empty">Ei julkaistuja sovelluksia.</li>';
            return;
          }
          ul.innerHTML = "";
          for (const app of apps) {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.className = "card";
            a.href = app + "/";
            a.innerHTML =
              '<span class="dot">' + initials(app) + "</span>" +
              '<span><span class="name">' + (TITLES[app] || app) + "</span><br>" +
              '<span class="path">/' + app + "/</span></span>" +
              '<span class="arrow">→</span>';
            li.appendChild(a);
            ul.appendChild(li);
          }
          if (data.built) {
            document.getElementById("built").textContent =
              "Julkaistu " + new Date(data.built).toLocaleString("fi-FI");
          }
        } catch {
          ul.innerHTML = '<li class="empty">Sovelluslistaa ei voitu ladata.</li>';
        }
      })();
    </script>
  </body>
</html>
