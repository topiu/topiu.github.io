<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1B2528; color: #E7EBE6;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  /* pan-x pan-y allows scrolling but withholds pinch-zoom, so the browser never
     zooms the page underneath the planner's own pinch handling.
     ("manipulation" would be pan-x pan-y PLUS pinch-zoom — not what we want.) */
  html, body { touch-action: pan-x pan-y; }
  #root {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  /* a long press must not raise a selection or callout UI: that steals the
     gesture and the app never sees the matching pointerup */
  input, textarea { -webkit-user-select: text; user-select: text; }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #93A5A6;
  }
  input, button, textarea { font-family: inherit; }
  /* keep iOS from zooming the page when a number field is focused */
  input[type="text"], input[type="file"], input:not([type]) { font-size: 16px; }
</style>

<body>
<div id="root"><div id="boot">Mökkipohja<br><span style="color:#3C5158">loading…</span></div></div>
<noscript><p style="padding:24px;font:14px system-ui">This planner needs JavaScript enabled.</p></noscript>
<script>
/* Block the browser's own zoom gestures. touch-action covers the standard path;
   Safari's legacy gesture* events need explicit handling, and preventing
   multi-touch touchmove catches anything left over on older WebViews. */
(function () {
  for (const ev of ["gesturestart", "gesturechange", "gestureend"]) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  }
  document.addEventListener("touchmove", function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
<script>
/* With ES modules, a module that throws while loading never reaches main.jsx,
   which would leave "loading…" on screen for good. Show what went wrong
   instead, the way the single-file build's try/catch did. Capture phase also
   sees a script or stylesheet that failed to download. */
(function () {
  function show(msg) {
    if (window.__mokkipohjaMounted) return;
    var root = document.getElementById("root");
    if (root) root.innerHTML = '<div id="boot">Something went wrong starting up.<br><span style="color:#B4402F">' +
      String(msg).replace(/[<>&]/g, "") + "</span></div>";
  }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) show("Could not load " + (t.src || t.href) + ". Check the connection and reload.");
    else show((e.error && e.error.message) || e.message || e);
  }, true);
  window.addEventListener("unhandledrejection", function (e) { show((e.reason && e.reason.message) || e.reason); });
})();
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
