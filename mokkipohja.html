<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1B2528; color: #E7EBE6;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  /* pan-x pan-y allows scrolling but withholds pinch-zoom, so the browser never
     zooms the page underneath the planner's own pinch handling.
     ("manipulation" would be pan-x pan-y PLUS pinch-zoom — not what we want.) */

  #root {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  /* a long press must not raise a selection or callout UI: that steals the
     gesture and the app never sees the matching pointerup */
  input, textarea { -webkit-user-select: text; user-select: text; }
  #boot {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #93A5A6;
  }
  input, button, textarea { font-family: inherit; }
  /* keep iOS from zooming the page when a number field is focused */
  input[type="text"], input[type="file"], input:not([type]) { font-size: 16px; }

/* Snap a room corner. Angle candidates win over the plain grid, so corners
   settle onto 45° and 90° rather than near them. */
function snapRoomVertex(p, pts, i, doc, grid, tol) {
  const n = pts.length;
  const A = pts[(i - 1 + n) % n],
    B = pts[(i + 1) % n];

  // 1. existing corners and wall ends snap exactly
  const verts = [];
  for (const w of doc.walls) verts.push({
    x: w.x1,
    y: w.y1
  }, {
    x: w.x2,
    y: w.y2
  });
  for (const r of doc.rooms) r.points.forEach((v, k) => {
    if (!(r.points === pts && k === i)) verts.push(v);
  });
  let best = null,
    bd = tol;
  for (const v of verts) {
    const d = Math.hypot(v.x - p.x, v.y - p.y);
    if (d < bd) {
      bd = d;
      best = {
        x: v.x,
        y: v.y,
        kind: "vertex"
      };
    }
  }
  if (best) return best;

  // 2. where a 15° direction off each neighbour crosses — both edges land square
  const dirs = [];
  for (let a = 0; a < 360; a += 15) dirs.push({
    x: Math.cos(a * D2R),
    y: Math.sin(a * D2R)
  });
  let pick = null,
    pd = tol;
  for (const d1 of dirs) for (const d2 of dirs) {
    const cross = d1.x * d2.y - d1.y * d2.x;
    if (Math.abs(cross) < 1e-6) continue;
    const t = ((B.x - A.x) * d2.y - (B.y - A.y) * d2.x) / cross;
    if (t < 1) continue;
    const q = {
      x: A.x + d1.x * t,
      y: A.y + d1.y * t
    };
    if ((q.x - B.x) * d2.x + (q.y - B.y) * d2.y < 1) continue;
    const d = Math.hypot(q.x - p.x, q.y - p.y);
    if (d < pd) {
      pd = d;
      pick = q;
    }
  }
  if (pick) return {
    x: pick.x,
    y: pick.y,
    kind: "angle"
  };

  // 3. failing that, line up just one edge
  pd = tol;
  for (const base of [A, B]) {
    for (const d of dirs) {
      const t = (p.x - base.x) * d.x + (p.y - base.y) * d.y;
      if (t < 1) continue;
      const q = {
        x: base.x + d.x * t,
        y: base.y + d.y * t
      };
      const dd = Math.hypot(q.x - p.x, q.y - p.y);
      if (dd < pd) {
        pd = dd;
        pick = q;
      }
    }
  }
  if (pick) return {
    x: pick.x,
    y: pick.y,
    kind: "angle"
  };

  // 4. plain grid
  if (grid) return {
    x: Math.round(p.x / grid) * grid,
    y: Math.round(p.y / grid) * grid,
    kind: "grid"
  };
  return {
    x: p.x,
    y: p.y,
    kind: null
  };
}

const defaultCeiling = () => ({
  mode: "flat",
  h: 2400,
  eaveH: 1300,
  ridgeH: 2900,
  axis: "x",
  ridge: 0.5
});
function ceilingAt(room, p) {
  const c = room.ceiling || defaultCeiling();
  if (c.mode === "flat") return c.h;
  const b = bbox(room.points);
  const v = c.axis === "x" ? p.x : p.y;
  const a0 = c.axis === "x" ? b.x0 : b.y0;
  const a1 = c.axis === "x" ? b.x1 : b.y1;
  const span = Math.max(a1 - a0, 1);
  if (c.mode === "shed") {
    const t = clamp((v - a0) / span, 0, 1);
    return c.eaveH + (c.ridgeH - c.eaveH) * t;
  }
  const rp = a0 + span * (c.ridge ?? 0.5);
  const half = Math.max(rp - a0, a1 - rp, 1);
  return Math.max(0, c.ridgeH - (c.ridgeH - c.eaveH) * (Math.abs(v - rp) / half));
}
/* axis positions where the ceiling crosses a given height */
function ceilingCrossings(room, T) {
  const c = room.ceiling || defaultCeiling();
  if (c.mode === "flat") return [];
  const b = bbox(room.points);
  const a0 = c.axis === "x" ? b.x0 : b.y0;
  const a1 = c.axis === "x" ? b.x1 : b.y1;
  const span = Math.max(a1 - a0, 1);
  const rise = c.ridgeH - c.eaveH;
  if (Math.abs(rise) < 1) return [];
  if (c.mode === "shed") {
    const t = (T - c.eaveH) / rise;
    return t > 0.02 && t < 0.98 ? [a0 + span * t] : [];
  }
  const rp = a0 + span * (c.ridge ?? 0.5);
  const half = Math.max(rp - a0, a1 - rp, 1);
  const d = half * (c.ridgeH - T) / rise;
  if (d <= 0 || d >= half) return [];
  return [rp - d, rp + d].filter(v => v > a0 + 20 && v < a1 - 20);
}
function roomAt(doc, p) {
  for (let i = doc.rooms.length - 1; i >= 0; i--) if (pointInPoly(p, doc.rooms[i].points)) return doc.rooms[i];
  return null;
}
/* lowest ceiling anywhere over a piece's footprint */
function headroomFor(item, def, doc) {
  const room = roomAt(doc, {
    x: item.x,
    y: item.y
  });
  if (!room) return null;
  const poly = itemPoly(item, def);
  let lo = Infinity;
  for (const p of [...poly, {
    x: item.x,
    y: item.y
  }]) lo = Math.min(lo, ceilingAt(room, p));
  return {
    room,
    mm: lo
  };
}

/* Draws the plan onto a 2D context. k = px per mm, (ox,oy) = px offset. */
function drawPlan(ctx, doc, defs, lang, o) {
  const {
    k,
    ox,
    oy

  const X = mm => mm * k + ox;
  const Y = mm => mm * k + oy;
  ctx.save();
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(0, 0, o.w, o.h);
  if (o.imgEl && doc.image) {
    ctx.globalAlpha = doc.image.opacity;
    ctx.drawImage(o.imgEl, X(doc.image.x), Y(doc.image.y), doc.image.natW * doc.image.mmPerPx * k, doc.image.natH * doc.image.mmPerPx * k);
    ctx.globalAlpha = 1;
  }
  if (o.grid) {
    for (const t of [{
      s: 100,
      c: "#E4E4D8",
      w: 0.6
    }, {
      s: 1000,
      c: "#C9CBB6",
      w: 1
    }]) {
      if (t.s * k < 4) continue;
      ctx.strokeStyle = t.c;
      ctx.lineWidth = t.w;
      const x0 = Math.floor(-ox / k / t.s) * t.s,
        x1 = (o.w - ox) / k;
      const y0 = Math.floor(-oy / k / t.s) * t.s,
        y1 = (o.h - oy) / k;
      ctx.beginPath();
      for (let x = x0; x <= x1; x += t.s) {
        ctx.moveTo(X(x), 0);
        ctx.lineTo(X(x), o.h);
      }
      for (let y = y0; y <= y1; y += t.s) {
        ctx.moveTo(0, Y(y));
        ctx.lineTo(o.w, Y(y));
      }
      ctx.stroke();
    }

    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)));
    ctx.closePath();
  };

    path(r.points);
    ctx.fillStyle = "#FAF9F1";
    ctx.fill();
    ctx.strokeStyle = "#BBBDA8";
    ctx.lineWidth = 1;
    ctx.setLineDash([7, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
    const b = bbox(r.points);
    ctx.fillStyle = "#7A8172";
    ctx.font = `600 ${Math.max(9, 11 * o.tk)}px sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(`${r.name}  ${(polyArea(r.points) / 1e6).toFixed(1)} m²`, X(b.cx), Y(b.cy));
    if (o.contours && r.ceiling && r.ceiling.mode !== "flat") {
      ctx.save();
      path(r.points);

        for (const v of ceilingCrossings(r, T)) {
          ctx.strokeStyle = "#9A7B3E";
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          if (ax === "x") {
            ctx.moveTo(X(v), Y(rb.y0));
            ctx.lineTo(X(v), Y(rb.y1));
          } else {
